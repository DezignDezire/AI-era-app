<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digitale Uhr</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        font-family: "Courier New", Courier, monospace;
      }

      #clock {
        color: #ff0000;
        font-size: clamp(3rem, 12vw, 8rem);
        font-weight: 700;
        letter-spacing: 0.12em;
      }
    </style>
  </head>
  <body>
    <div id="clock" aria-label="Uhrzeit"></div>
    <script>
      const clock = document.getElementById("clock");

      const updateClock = () => {
        clock.textContent = new Date().toLocaleTimeString("de-DE", {
          hour12: false,
        });
      };

      updateClock();
      setInterval(updateClock, 1000);
    </script>
  </body>
</html>
