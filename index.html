<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digitale Uhr & Melde hier den Aktuelles ein!</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #000;
        color: #f5f5f5;
        font-family: "Courier New", Courier, monospace;
      }

      main {
        width: min(860px, 100%);
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }

      #clock {
        color: #ff0000;
        text-align: center;
        font-size: clamp(3rem, 12vw, 8rem);
        font-weight: 700;
        letter-spacing: 0.12em;
        margin-bottom: 2rem;
      }

      .panel {
        background: #111;
        border: 1px solid #222;
        border-radius: 12px;
        padding: 1rem;
      }

      form {
        display: grid;
        gap: 0.75rem;
      }

      label {
        display: grid;
        gap: 0.25rem;
        font-size: 0.95rem;
      }

      input,
      textarea,
      button {
        font: inherit;
      }

      input,
      textarea {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid #333;
        border-radius: 8px;
        background: #050505;
        color: #f5f5f5;
      }

      textarea {
        min-height: 90px;
        resize: vertical;
      }

      button {
        padding: 0.65rem 1rem;
        border: none;
        border-radius: 8px;
        background: #ff0000;
        color: #fff;
        cursor: pointer;
        font-weight: 700;
      }

      #status {
        min-height: 1.2rem;
        margin: 0.5rem 0 0;
        font-size: 0.9rem;
      }

      #messages {
        list-style: none;
        padding: 0;
        margin: 1.25rem 0 0;
        display: grid;
        gap: 0.75rem;
      }

      .message-item {
        border: 1px solid #2b2b2b;
        border-radius: 10px;
        padding: 0.75rem;
        background: #090909;
      }

      .message-meta {
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.4rem;
        font-size: 0.85rem;
        color: #cfcfcf;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="clock" aria-label="Uhrzeit"></div>

      <section class="panel" aria-labelledby="guestbook-heading">
        <h1 id="guestbook-heading">Melde hier den Aktuelles ein!</h1>
        <form id="message-form" novalidate>
          <label for="name">Name</label>
          <input id="name" name="name" maxlength="60" required />

          <label for="message">Nachricht</label>
          <textarea id="message" name="message" maxlength="400" required></textarea>

          <label class="sr-only" for="website">Website (leer lassen)</label>
          <input
            id="website"
            name="website"
            class="sr-only"
            autocomplete="off"
            tabindex="-1"
          />

          <button type="submit">Nachricht senden</button>
        </form>
        <p id="status" aria-live="polite"></p>
        <ul id="messages" aria-label="Nachrichtenliste"></ul>
      </section>
    </main>

    <script>
      const SUPABASE_URL =
        window.__SUPABASE_URL || "https://lavogfuccmkiftaomstq.supabase.co";
      const SUPABASE_ANON_KEY =
        window.__SUPABASE_ANON_KEY || "sb_publishable_W2R6wjPLWUSo1QRgvGN_VQ_2b_9Gohr";

      const clock = document.getElementById("clock");
      const form = document.getElementById("message-form");
      const nameInput = document.getElementById("name");
      const messageInput = document.getElementById("message");
      const honeypotInput = document.getElementById("website");
      const statusElement = document.getElementById("status");
      const messagesList = document.getElementById("messages");

      const MAX_NAME_LENGTH = 60;
      const MAX_MESSAGE_LENGTH = 400;
      const MIN_SECONDS_BETWEEN_SUBMITS = 5;
      let lastSubmitAt = 0;

      const hasSupabaseConfig =
        !SUPABASE_URL.includes("YOUR-PROJECT") &&
        !SUPABASE_ANON_KEY.includes("YOUR-SUPABASE-ANON-KEY");

      const supabaseRestUrl = `${SUPABASE_URL}/rest/v1/guestbook_entries`;
      const supabaseHeaders = {
        apikey: SUPABASE_ANON_KEY,
      };

      const setStatus = (text, isError = false) => {
        statusElement.textContent = text;
        statusElement.style.color = isError ? "#ff8b8b" : "#cfcfcf";
      };

      const updateClock = () => {
        clock.textContent = new Date().toLocaleTimeString("de-DE", {
          hour12: false,
        });
      };

      const formatDate = (timestamp) => {
        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) return "";
        return date.toLocaleString("de-DE", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      };

      const renderMessages = (messages) => {
        messagesList.innerHTML = "";
        if (!messages.length) {
          const empty = document.createElement("li");
          empty.textContent = "Noch keine Nachrichten vorhanden.";
          messagesList.appendChild(empty);
          return;
        }

        for (const item of messages) {
          const listItem = document.createElement("li");
          listItem.className = "message-item";

          const meta = document.createElement("div");
          meta.className = "message-meta";

          const nameStrong = document.createElement("strong");
          nameStrong.textContent = item.name;
          const timeSpan = document.createElement("span");
          timeSpan.textContent = formatDate(item.created_at);

          meta.appendChild(nameStrong);
          meta.appendChild(timeSpan);

          const messageParagraph = document.createElement("p");
          messageParagraph.textContent = item.message;

          listItem.appendChild(meta);
          listItem.appendChild(messageParagraph);
          messagesList.appendChild(listItem);
        }
      };

      const fetchMessages = async () => {
        if (!hasSupabaseConfig) {
          setStatus(
            "Supabase ist noch nicht konfiguriert. Siehe README für die Einrichtung.",
            true
          );
          renderMessages([]);
          return;
        }

        const response = await fetch(
          `${supabaseRestUrl}?select=name,message,created_at&order=created_at.desc&limit=100`,
          {
            headers: supabaseHeaders,
          }
        );

        if (!response.ok) {
          setStatus(
            "Nachrichten konnten nicht geladen werden. Bitte später erneut versuchen.",
            true
          );
          return;
        }

        const data = await response.json();
        renderMessages(data || []);
        setStatus("Nachrichten geladen.");
      };

      const validateInput = (name, message) => {
        if (!name || !message) {
          return "Bitte Name und Nachricht ausfüllen.";
        }
        if (name.length > MAX_NAME_LENGTH || message.length > MAX_MESSAGE_LENGTH) {
          return "Eingaben sind zu lang.";
        }
        return "";
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!hasSupabaseConfig) {
          setStatus(
            "Supabase ist noch nicht konfiguriert. Siehe README für die Einrichtung.",
            true
          );
          return;
        }

        if (honeypotInput.value.trim()) {
          setStatus("Spam erkannt.", true);
          return;
        }

        const now = Date.now();
        if (now - lastSubmitAt < MIN_SECONDS_BETWEEN_SUBMITS * 1000) {
          setStatus("Bitte kurz warten, bevor du erneut sendest.", true);
          return;
        }

        const name = nameInput.value.trim();
        const message = messageInput.value.trim();
        const validationError = validateInput(name, message);
        if (validationError) {
          setStatus(validationError, true);
          return;
        }

        setStatus("Speichere Nachricht ...");
        const response = await fetch(supabaseRestUrl, {
          method: "POST",
          headers: {
            ...supabaseHeaders,
            "Content-Type": "application/json",
            Prefer: "return=minimal",
          },
          body: JSON.stringify([
            {
              name,
              message,
            },
          ]),
        });

        if (!response.ok) {
          setStatus(
            "Nachricht konnte nicht gespeichert werden. Bitte erneut versuchen.",
            true
          );
          return;
        }

        lastSubmitAt = now;
        form.reset();
        setStatus("Nachricht gespeichert.");
        await fetchMessages();
      });

      updateClock();
      setInterval(updateClock, 1000);
      fetchMessages();
    </script>
  </body>
</html>
